services:
  - type: web
    name: sarva-setu-hospital-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python build_db.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: HOSPITAL_CSV_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
